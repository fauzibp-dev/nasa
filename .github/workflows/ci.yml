name: Offline research checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Python syntax
        run: python -m compileall -q tools labs tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Lint fictional lab report
        run: python tools/report_lint.py examples/lab-report.md
      - name: Review local Python tools for risky syntax patterns
        run: python tools/code_review.py tools --strict
      - name: Lint synthetic XSS lab report
        run: python tools/report_lint.py examples/xss-lab-report.md
      - name: Render offline public-surface inventory (no network targets)
        run: python tools/passive_surface.py
      - name: Verify default scope is empty
        run: |
          if grep -vE '^[[:space:]]*(#|$)' scope.txt | grep -q .; then
            echo 'Unexpected real host added to public default scope.txt'
            exit 1
          fi
          echo 'PASS: no pre-authorized targets'
